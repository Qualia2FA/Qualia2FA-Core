[package]
name = "qualia2fa-core"
version = "0.4.1"
edition = "2024"
# MSRV policy: 1.89 is the minimum supported version, not the development toolchain.
# The development toolchain is pinned to stable (currently 1.99) by rust-toolchain.toml.
# The 1.89 floor comes from the crypto stack (the tightest is aes 0.9.3); this crate's
# own code compiles on 1.85, so 1.89 leaves headroom for upstream tightening.
rust-version = "1.89"
description = "Qualia2FA core library: TOTP/HOTP primitives, encrypted vault and device sync"
license = "LGPL-3.0-or-later"

# The upstream repository URL, used by `cargo doc`, crates.io and the publish workflow.
repository = "https://github.com/Qualia2FA/Qualia2FA-Core"
readme = "README.en.md"
keywords = ["2fa", "totp", "hotp", "otp", "authentication"]
categories = ["authentication", "cryptography"]
# CI configuration, the dependency audit manifest and the fuzz targets are not part of
# the published package: they are meaningless to users, and the size and contents of a
# crates.io package are publicly visible.
exclude = ["/.github", "/deny.toml", "/fuzz"]

[dependencies]
# ── Passphrase derivation for the recovery key ───────────────────
# Argon2id (RFC 9106), used to turn a user passphrase into the recovery file's
# encryption key.
#
# Argon2id rather than PBKDF2 or scrypt: a recovery file is stored on cloud drives,
# USB sticks or mail attachments, so the attacker is assumed to hold the file and
# passphrase strength is the only defence. PBKDF2 is purely computational, giving GPU
# cracking a large payoff; scrypt is memory-hard but its N/r/p parameters are easy to
# configure as "expensive-looking but cheap"; Argon2id won the Password Hashing
# Competition, is recommended by RFC 9106, and resists GPUs and side channels at once
# (the id variant mixes data-dependent with data-independent memory access).
#
# `password-hash` cannot be switched off: argon2 0.6's lib.rs unconditionally
# `use password_hash::...`, making the feature effectively mandatory even though
# Cargo.toml lists it as optional. It pulls in base64ct plus one small utility crate.
#
# `zeroize` is enabled so that the library's working area (Argon2's memory blocks) is
# erased on drop. The default parameters allocate 64 MiB at a time, so not erasing
# would leave the passphrase's derivation state on the heap.
#
# `parallel` is not enabled: parallelism is fixed at 1, see PARALLELISM in
# src/recovery.rs.
argon2 = { version = "0.6.0", features = ["zeroize"] }
# ── Authenticated encryption ──────────────────────────────────────────
# Vault entries are encrypted with XChaCha20-Poly1305 (the 192-bit nonce variant of
# RFC 8439).
#
# The nonce is 192-bit rather than the usual 96-bit: devices encrypt independently of
# each other with no central coordination, so random nonces are the only realistic
# choice, and 96-bit random nonces hit the birthday bound at vault sizes (for
# `aes-gcm` that is an unsafe usage), whereas 192-bit random nonces keep ample margin.
# The ChaCha family also needs no AES-NI hardware and behaves identically everywhere.
#
# The recommended encryption (RustCrypto), implemented in pure Rust with no C or
# assembly dependency, so cross-compiling to Android / iOS needs no extra toolchain
# configuration.
chacha20poly1305 = "0.11.0"

form_urlencoded = "1.2"
# Randomness comes only from getrandom (the OS CSPRNG), never from a userspace PRNG.
# On Android the syscall needs API 23; aarch64/arm/x86/x86_64 fall back to
# /dev/urandom on lower versions.
getrandom = "0.4.3"

# ── Subkey derivation ────────────────────────────────────────────────
# HKDF-SHA256 (RFC 5869), used to derive purpose-separated subkeys from the master key.
#
# blake3 is deliberately not used: it compiles C and hand-written assembly for every
# target platform, adding build risk to the Android cross-compilation matrix, while
# this project needs only a standard KDF. `hkdf` is pure Rust and shares the
# RustCrypto 0.13 series with the existing `hmac`, so it adds no second
# `digest`/`hmac` version.
#
# Subkeys are derived rather than encrypting with the master key directly so that the
# master key never occupies a ciphertext's key position: the master key also takes part
# in device pairing and recovery, and purpose separation limits the blast radius of a
# single leak.
hkdf = "0.13"

hmac = "0.13"

# ── Sync payload compression ──────────────────────────────────────────────
# A pure-Rust deflate implementation. `flate2` is deliberately not used: it is only a
# facade whose default backend is C miniz/zlib, and reaching the pure-Rust backend
# requires explicitly selecting the `rust_backend` feature — which is the only thing
# this crate needs. Depending on `miniz_oxide` directly removes one layer of
# indirection and one chance of a later feature edit silently switching to the C
# backend.
#
# Pure Rust is required because `qualia2fa-core` has `#![forbid(unsafe_code)]` and
# cross-compiles to Android / iOS: a C dependency would give those two targets a build
# configuration each, whereas this library's value is identical behaviour and identical
# build steps on every platform.
#
# `zstd` is deliberately not used: it compresses better but is a C implementation (or a
# binding that needs `unsafe`), which conflicts with the purity rule above. A sync
# payload is a few thousand to a few tens of thousands of short records, a scale at
# which the deflate/zstd gap does not pay for a C dependency.
#
# License `MIT OR Zlib OR Apache-2.0` (a choice of three), compatible with
# LGPL-3.0-or-later.
miniz_oxide = "0.9.1"

# ── Device identity (ECDSA P-256 verification) ────────────────────────────
# Used for verification only, never for signing: the device private key lives in
# platform hardware and signing is initiated by the platform key store. Verification
# must be executable by any device, including one that holds no hardware key itself,
# so it belongs to the core library.
#
# The version must stay at 0.14. Its `ecdsa` feature depends on `sha2 ^0.11`, the same
# generation as this library, so it adds no second SHA-2. `p256 0.13` depends on
# `sha2 ^0.10`, and mixing the two puts two SHA-2 implementations and two incompatible
# sets of P-256 types in one binary. That is not merely a size problem: two
# implementations mean properties such as constant-time behaviour must be argued twice,
# and we can guarantee neither.
#
# Default features are off and `ecdsa` is enabled explicitly: the default set's `pem`
# pulls in `pkcs8` and `elliptic-curve/pem`, whereas our wire format has only SEC1
# uncompressed points and raw r||s, neither of which needs PEM.
#
# `ecdh` supports the pairing key agreement (see `src/pairing.rs`). P-256 is reused
# rather than adding X25519: P-256 has cofactor 1 and no small-order points, so an ECDH
# result needs no "reject an all-zero output" check the way X25519 does — one less
# check to get wrong, and one less elliptic-curve implementation to audit. The cost is
# that scalar multiplication is slower than X25519, and a pairing performs it twice.
#
# Curve choice is documented in `qualia-dik`'s `device` module: P-256 is the only
# signing algorithm that reaches hardware on both mobile platforms, a hard constraint
# rather than a preference.
#
# The only direct use of `p256` in this crate is the pairing protocol's ECDH (`ecdh`
# feature); device identity public-key parsing and verification live in `qualia-dik`,
# which declares `p256` itself. The versions on both sides must match, or one binary
# ends up with two P-256 implementations.
p256 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "std"] }

# Device identity: public-key representation, fingerprint and verification, plus the
# platform hardware key store.
#
# It is a separate crate published to crates.io because what it does — generate a P-256
# identity key pair in platform hardware and represent/verify such an identity — is
# unrelated to this crate's vault format, sync protocol and pairing flow, so any
# project needing a hardware device identity can use it directly. The dependency
# direction is therefore qualia-dik ← this crate, never the reverse. It is also the only
# crate in the project allowed to use `unsafe`, since platform FFI calls are inherently
# unsafe while this crate has `#![forbid(unsafe_code)]`.
#
# A version number is used rather than a path because qualia-dik is published to
# crates.io and is the only form in which local, CI and third-party consumers see the
# same source: a path dependency makes one physical directory reachable through
# different relative paths in different repositories, which Cargo treats as two
# packages (`package collision in the lockfile`), and an `../Xxx` checkout outside the
# workspace is rejected outright by `actions/checkout` on GitHub Actions. To work on
# that crate locally, point `[patch.crates-io]` at the sibling directory temporarily —
# a legitimate `[patch]` use that affects only this workspace.
qualia-dik = "0.1"
# Reading a QR code back out of an image, which is what the HTML export of another
# authenticator puts its only copy of a time step into: the table's columns carry
# everything else.
#
# Only the scanning half is taken (`scan-image`), because only that half is wanted: this
# crate neither draws codes nor reads a camera.
#
# The pixels are handed in **already decoded** — no image file format is understood on
# either side of this boundary, and the one this crate does understand it understands
# itself (see `src/import/png.rs`, which turns the PNG the export embeds into the
# grayscale plane this expects). Decoding a file format is where the historical
# vulnerabilities live; here the input is a base64 blob inside a document that was
# already bounded before it was decoded.
#
# 0.1.4 is the version that added `qr::encode_text`, which the HTML export needs: the
# code it draws is another application's text and must not go through this project's own
# QR envelope. 0.1.3 and earlier would not compile.
qualia-transport = { version = "0.1.6", default-features = false, features = ["scan-image"] }

# Secret-material containers (`SecretBox` / `SecretSlice` / `SecretString` /
# `ExposeSecret`). Dependency audit, checked item by item (cargo-deny does not judge
# whether a dependency is necessary):
#   - The only required dependency is `zeroize ^1.6`, the same major version this crate
#     used before, so no duplicate version appears (`cargo tree` shows exactly one
#     zeroize in the whole tree).
#   - The optional `serde ^1` dependency is not enabled here and stays out of the tree.
#   - The upstream monorepo `iqlusioninc/crates` is active (not archived, recently
#     pushed to); the crate itself has had no release since 2024-10, making it mature
#     and stable rather than abandoned, and it is a pure logic wrapper (no unsafe, no
#     FFI). Only src/secret.rs touches it, so it can be swapped out wholesale if needed.
secrecy = "0.10.3"
sha1 = "0.11"
sha2 = "0.11"

# ── mOTP (Mobile-OTP) code generation ─────────────────────────────────────
# MD5 is required by the mOTP algorithm itself, not chosen here: the code is
# `lowerhex(md5(decimal_counter || lowerhex(secret) || pin))[0..6]`, where the counter is
# `floor(unix_seconds / 10)`. There is no specification document for mOTP, so the
# definition used is the one Aegis ships; see `src/motp.rs` for the vectors and their
# source.
#
# The constraint this dependency carries: **MD5 is used for nothing else**. It takes no
# part in AEAD, in any KDF, in signatures, or in any integrity or freshness decision
# this library makes — it produces mOTP codes and stops there.
#
# It shares the existing `digest 0.11` generation with `sha1`/`sha2`, so no second hash
# implementation enters the tree: `cargo tree` still shows exactly one `digest` and one
# `const-oid` (verified when the dependency was audited).
md-5 = "0.11.0"
subtle = "2.6"
# `tinyjson` reads another authenticator's JSON export. It is **pinned exactly**: its last
# release is 2022-12-31, and the reason it was chosen over `serde_json` is that it is the only
# candidate that forbids `unsafe` in the language (`#![forbid(unsafe_code)]`, not `deny`), has
# **no** direct dependencies, and is ~1.5k lines in four files. A zero-dependency, thousand-line,
# general-purpose JSON parser belongs to the "stable is finished" kind, but a pinned version is
# what makes that judgement safe to rely on: a new release would have to be audited again before
# it is taken.
tinyjson = "=2.5.1"
# `aes-gcm` and `scrypt` open another authenticator's **encrypted** export, which uses
# AES-256-GCM and scrypt. Both are audited dependencies of this crate's own tree already
# (`chacha20poly1305` shares the same `aead`/`digest` generations, so no second copy of either
# enters), and neither is used for anything this library writes: the vault and the sync payload
# keep their own constructions.
aes-gcm = "0.11.1"
scrypt = "0.12.0"

# The library's public API uses thiserror for all error types; `anyhow` must not appear
# in a public signature.
thiserror = "2.0.21"

# `zeroize` is deliberately not a direct dependency: it arrives transitively through
# `secrecy`, which does its own `pub use zeroize`; reach the `Zeroize` trait as
# `secrecy::zeroize`. Not depending on it directly keeps the two version requirements
# from drifting apart. If a secret type ever appears that `secrecy` does not cover (and
# therefore needs its own `Drop` erasure), add it back explicitly together with its
# `derive` feature.

[dev-dependencies]
# Property-based testing, for properties that must hold for arbitrary input. It
# complements fuzzing (the fuzz/ directory, which looks for panics and memory
# problems); both are needed.
proptest = "1.12.0"
