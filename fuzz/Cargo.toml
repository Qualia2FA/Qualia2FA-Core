# The cargo-fuzz target crate.
#
# Note: this crate is **not** a workspace member of `../Cargo.toml`; cargo-fuzz handles
# it separately, so `cargo test` / `cargo clippy` under Core/ never compile this
# directory.

[package]
name = "qualia2fa-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
# The fuzz targets feed arbitrary bytes to the library's public parsing entry points.
libfuzzer-sys = "0.4.13"
qualia2fa-core = { path = ".." }
# The device identity types (`DevicePublicKey` / `DeviceSignature`) live in `qualia-dik`
# and Core merely re-exports them; a fuzz target is clearer depending on the original
# crate, and avoids depending on a re-export that exists only for convenience.
qualia-dik = "0.1"
# `login_handshake` needs a real device identity (a valid P-256 public key and
# signature), while the library deliberately does not export "generate a device private
# key" — that belongs to the platform key store — so this target substitutes a fixed
# scalar.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }

[[bin]]
name = "secret_debug_redaction"
path = "fuzz_targets/secret_debug_redaction.rs"
test = false
doc = false
bench = false

# Attacker-controlled input surface: QR codes, the clipboard and manually typed links
# all arrive here.
[[bin]]
name = "uri_parse"
path = "fuzz_targets/uri_parse.rs"
test = false
doc = false
bench = false

# The only path every secret passes through: bit alignment, trailing remainder and
# padding validation.
[[bin]]
name = "base32_and_otp"
path = "fuzz_targets/base32_and_otp.rs"
test = false
doc = false
bench = false

# Attacker-controlled input surface: a vault file reaches uncontrolled places (cloud
# drives, QR codes, another device), so the adversary chooses every length field.
[[bin]]
name = "vault_parse"
path = "fuzz_targets/vault_parse.rs"
test = false
doc = false
bench = false

# Attacker-controlled input surface: Msg1 and Msg2 of the login handshake. A QR code is
# public (it is displayed on screen), so anyone who can see it can send arbitrary bytes
# down these two paths.
[[bin]]
name = "login_handshake"
path = "fuzz_targets/login_handshake.rs"
test = false
doc = false
bench = false

# Attacker-controlled input surface: an export file the user picked. It was written by another
# program and can be truncated, half-copied or hostile; every format is tried on every input,
# and the report must not quote what it read.
[[bin]]
name = "aegis_import"
path = "fuzz_targets/aegis_import.rs"
test = false
doc = false
bench = false

# Attacker-controlled input surface: the sync payload. It is wider than a vault file —
# **any device on the same LAN** can push bytes at it without the user doing anything.
# The target covers the outer envelope, the decompression limit and the variable-length
# plaintext parsing after decompression.
[[bin]]
name = "sync_payload"
path = "fuzz_targets/sync_payload.rs"
test = false
doc = false
bench = false

# Attacker-controlled input surface: the application lock's password wrap. It is a file
# beside the vault, reachable by a backup tool or an attacker with file access, and it
# declares its own KDF cost — the bounds must be checked before Argon2id allocates.
[[bin]]
name = "lock_password_parse"
path = "fuzz_targets/lock_password_parse.rs"
test = false
doc = false
bench = false
